<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Produtos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Gerenciamento de Produtos</h1>
        <p>Frontend Spring Boot &mdash; Sistemas Distribuídos e Mobile</p>
    </header>

    <main>
        <section class="card">
            <h2 id="formTitulo">Cadastrar Produto</h2>
            <form id="produtoForm">
                <input type="hidden" id="produtoId">
                <label for="nome">Nome</label>
                <input type="text" id="nome" placeholder="Ex.: Teclado Mecânico" required>
                <label for="preco">Preço (R$)</label>
                <input type="number" id="preco" step="0.01" min="0" placeholder="Ex.: 250.00" required>
                <div class="botoes">
                    <button type="submit" id="btnSalvar">Salvar</button>
                    <button type="button" id="btnCancelar" class="secundario" hidden>Cancelar edição</button>
                </div>
            </form>
            <div id="mensagem" class="mensagem" hidden></div>
        </section>

        <section class="card">
            <div class="lista-topo">
                <h2>Produtos Cadastrados</h2>
                <button type="button" id="btnAtualizar" class="secundario">Atualizar lista</button>
            </div>
            <table>
                <thead>
                    <tr><th>ID</th><th>Nome</th><th>Preço</th><th>Ações</th></tr>
                </thead>
                <tbody id="produtosList">
                    <tr><td colspan="4" class="vazio">Carregando...</td></tr>
                </tbody>
            </table>
        </section>
    </main>

    <footer>API: <code id="apiUrl"></code></footer>
    <script src="script.js"></script>
</body>
</html>
